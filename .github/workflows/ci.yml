name: CI

# docs/standards/11-ci-deployment.md, 11.2 + 11.5 — sygnał o awarii ma być jawny w repo (PR),
# nie tylko pośrednio przez build hostingu. Dwa niezależne joby: jakość kodu (11.2) i audyt
# podatności zależności (11.5) — rozdzielone, żeby znana, nienaprawialna od razu podatność
# nie blokowała np. mergowania czystego fixa lintera, i odwrotnie.

# paths-ignore: commity czysto dokumentacyjne (docs/, *.md, .claude/) nie zmieniają niczego,
# co lint/typecheck/test/build/audit mogłyby wykryć — pomijanie ich oszczędza minuty Actions
# (limit konta, nie tylko koszt), patrz docs/memory.md. Ścieżka tego pliku (.github/workflows/)
# nie jest objęta wzorcami niżej, więc zmiana samego ci.yml nadal zawsze uruchamia CI.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:i18n-guard
      - run: pnpm check:pomoc-guard
      - run: pnpm check:ai-tools-guard
      - run: pnpm test
      - run: pnpm build

  # docs/standards/10-testy.md 10.8/10.9 + D59 — testy Service Workera w prawdziwej przeglądarce na
  # buildzie produkcyjnym (nigdy na `dev`: błąd precache wychodzi tylko tam, 5.8). Osobny job, bo
  # `pnpm test:e2e` sam robi trzy buildy (~3–5 min) — nie wydłuża sygnału z `quality`. Chromium z
  # tej samej wersji pakietu `playwright` co w pnpm-lock.yaml (`--with-deps`: biblioteki systemowe).
  e2e-sw:
    name: E2E Service Worker (10.8, 10.9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

  dependency-audit:
    name: Dependency vulnerability audit (11.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 11.5 dosłownie: podatność high/critical w zależności BEZPOŚREDNIEJ blokuje merge,
      # tranzytywne tylko informacyjnie. `pnpm audit --audit-level=high` sam blokowałby też
      # na tranzytywnych (szerszy zakres niż reguła wymaga) — scripts/audit-gate.mjs filtruje
      # po package.json (pnpm audit --json nie ma pola isDirect jak npm, patrz komentarz w
      # skrypcie i docs/przyklady/ci/README.md). Świadomie zaakceptowane wyjątki: odnotować
      # w docs/memory.md z powodem, nie wyciszać tutaj bez śladu.
      - run: pnpm audit:gate
